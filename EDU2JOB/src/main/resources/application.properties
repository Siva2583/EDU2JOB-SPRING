# ============================================================
# EDU2JOB 2.0 — Spring Boot configuration
# All secrets and environment-specific values are injected via
# environment variables. The fallbacks below are LOCAL-DEV ONLY.
# See .env.example at the repository root for the full list.
# ============================================================

spring.application.name=edu2job-backend
server.port=${PORT:8080}

# --- PostgreSQL (existing database — do not point this at a fresh
# --- database if you want to keep existing users and history) ---
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/edu2job}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

# 'update' only ever ADDS missing tables/columns (all new EDU2JOB 2.0
# columns are nullable), so existing rows are preserved. See
# src/main/resources/db/migration/V2__edu2job_2_profile_and_prediction.sql
# for the equivalent manual SQL if you prefer to migrate by hand.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- JWT (unchanged scheme: HS256, 10h expiry, BCrypt passwords) ---
edu2job.jwt.secret=${JWT_SECRET:your_very_secure_secret_key_change_this_in_production}

# --- Flask ML service (Spring Boot is the only caller) ---
edu2job.flask.base-url=${FLASK_BASE_URL:http://localhost:5000}
edu2job.flask.connect-timeout-ms=${FLASK_CONNECT_TIMEOUT_MS:3000}
edu2job.flask.read-timeout-ms=${FLASK_READ_TIMEOUT_MS:30000}
